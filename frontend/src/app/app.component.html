<div class="shell">
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo">🛡️</span>
      <h1>{{ title }}</h1>
    </div>
    <nav class="topbar__nav">
      <a routerLink="/tableau-de-bord" routerLinkActive="active">Tableau de bord</a>
      <a routerLink="/corrections" routerLinkActive="active">Corrections</a>
      <a routerLink="/historique" routerLinkActive="active">Historique</a>
    </nav>
  </header>

  @if (demo) {
    <div class="demo-banner">
      Mode démo — données mockées, <strong>aucune écriture réelle</strong> sur un site Kajabi.
      L'usage réel se fait en local (<code>dotnet run</code>).
    </div>
  }

  <main class="content">
    <router-outlet />
  </main>
</div>
